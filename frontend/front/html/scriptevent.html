<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script event</title>
</head>
<body>
    <script>
        /// JavaScript 코드를 여기에 작성하세요.
        console.log("Hello, World!");
        // text 변경도 event 로 할수잇음 
        // 이벤트(Event)는 사용자의 동작이나 브라우저의 상태 변화 등 특정 상황에서 발생하는 사건을 의미합니다. 이벤트를 활용하면 웹 페이지에서 다양한 상호작용을 구현할 수 있습니다.
        // react 같은 경우는 status 관리를 -> reactive status 로 관리함 
        // 실시간성 
        //event 를 관리하는건 handler 라고 함
        // 이벤트 핸들러(Event Handler)는 특정 이벤트가 발생했을 때 실행되는
        // 함수를 의미합니다. 이벤트 핸들러를 사용하면 사용자의 동작이나 브라우저의 상태 변화에 따라 원하는 동작을 수행할 수 있습니다.
        //btn large btn small -> 이건 반응형으로 할떄
        //.d-grid .d-flex -> 이건 flexbox 로 할떄 , 눈에 보이지 않는 12 칸을 갖고 냐ㅗ는것 
        //실제 component ui 를 만드는 것으로 react 를 
        //npm  으로 설치할때 bootstrap 을 설치하고 import 해서 쓰는게 일반적임 
        // 그래서 보통 react 하고 같이 옴
    </script>
    <div class="container my-5">
        <form class="border rounded p-4 shadow-sm">
            <h2 class="mb-4">Bootstrap Form</h2>
            <div class="mb-3">
                <label for="name" class="form-label">이름</label>
                <input type="text" class="form-control" id="name" placeholder="이름을 입력하세요">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="email" class="form-control" id="email" placeholder="이메일을 입력하세요">
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">메시지</label>
                <textarea class="form-control" id="message" rows="4" placeholder="메시지를 입력하세요"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">전송</button>
        </form>
    </div>
    <script>
        const signInHandler = (event) => {
            event.preventDefault(); // 폼 제출 기본 동작 방지
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            console.log("이름:", name);
            console.log("이메일:", email);
            console.log("메시지:", message);

            // 여기서 서버로 데이터를 전송하거나 다른 작업을 수행할 수 있습니다.
        };
    </script>

    <button id="signInButton" class="btn btn-primary" onclick="signInHandler(event)">Sign In</button>

    </body>


</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scriptfunction</title>
    
</head>
<body>
    <script>
        // JavaScript 코드를 여기에 작성하세요.
        console.log("Hello, World!");
        //document.write("Hello, World!"); 
        // 이렇게 작성해도 됨 

        // 내장 객체 -> 요소를 탐색하고 조작, event 처리, 브라우저와 상호작용 등 다양한 기능을 제공
        // window, document, location, history, navigator, screen 등
        
        //뭐 근데 여기서 함수 정의하고 호출하는거 보여주고 싶음
        function greet(name) {
            return "Hello, " + name + "!";
        }
        // 함수는 정의만 해서는 실행되지 않음. 호출해야 함
        var message = greet("Alice");
        console.log(message); // 콘솔에 "Hello, Alice!" 출력

        // 함수 : 메서드 -> 매서드 독립실행 불가능, 함수는 독림시행 가능
        // OOP -> 객체지향프로그래밍, 클래스 기반, 상속, 캡슐화, 다형성
        // arrow function -> ES6, 간결한 문법, this 바인딩, 익명 함수, 콜백 함수에 자주 사용
        // lambda function -> 함수형 프로그래밍, 일급 객체, 고차 함수, 불변성, 순수 함수, 부작용 최소화
        // lambda 는 1회성 함수

        // -> 결국 코드 블록임 : 코드 블럭이 뭐냐? 
        // 코드 블록은 중괄호 {}로 감싸진 코드의 집합을 의미합니다.
        // 코드 블록은 특정 조건이나 반복문, 함수 등에서 실행되는 코드의 범위를 정의하는 데 사용됩니다. 코드 블록 안에 작성된 코드는 해당 블록이 실행될 때만 실행됩니다.
        //
        function add(a, b) {
            return a + b;
        }
        // 함수 호출
        var result = add(3, 5);
        console.log(result); // 콘솔에 8 출력
        //arrow function
        const multiply = (a, b) => a * b;
        //button 을 정의하고 함 해보자
        //anonymous function 은 머냐
        // 익명 함수(Anonymous Function)는 이름이 없는 함수를 의미합니다. 일반적으로 변수에 할당되거나 다른 함수의 인자로 전달될 때 사용됩니다. 익명 함수는 일회성으로 사용되거나 특정 작업을 수행하기 위해 정의되는 경우가 많습니다.
        (function () {
            console.log("익명 함수 실행");
        })();

        //es 6 이후에는 arrow function 으로 익명함수를 정의하는게 일반적임
        let arrowFunction = () => {
            console.log("Arrow Function 실행");
        };

        //() 안에 비엇죠? 
        // 근데 화살표 함수는 주의점이 있음
        // 화살표 함수는 this 바인딩이 다르게 동작합니다. 일반 함수에서는 호출한 객체를 this로 참조하지만, 화살표 함수에서는 상위 스코프의 this를 그대로 사용합니다. 따라서 화살표 함수를 사용할 때는 this의 의미를 잘 이해하고 사용해야 합니다.
        // 화살표 함수는 생성자 함수로 사용할 수 없습니다. 일반 함수는 new
        // 키워드를 사용하여 객체를 생성할 수 있지만, 화살표 함수는 생성자 함수로 사용할 수 없습니다. 따라서 객체를 생성하려면 일반 함수를 사용해야 합니다.

        // 화살표함수 block 이 아니라면 return 을 생략할 수 있음
        const square = x => x * x;

        // 쓰고 안쓰고 차이점이 좀 잇다
        // function 도 변수의 type 이다 

        let obj = {
            name : "Alice",
            study : function() {
                return ["Math", "Science", "History"];
            }
        }

        // 이렇게 하면 obj.study() 가 배열을 반환하고, forEach 를 통해 각 요소를 순회하면서 콘솔에 출력하게 됨
        // name 이라는 property 는 그냥 문자열임, study 는 function 이라는 property 임
        

        obj.study().forEach(function(subject) {
            console.log(subject);
        });
        //구조 분해 : Destructuring 
        // 구조 분해 할당(Destructuring Assignment)은 배열이나 객체의 값을 개별 변수로 쉽게 추출할 수 있는 문법입니다. 이를 통해 코드의 가독성을 높이고, 변수 선언을 간결하게 만들 수 있습니다.
        let person = {
            name: "Alice",
            age: 25,
            city: "New York"
        };
        // 객체 구조 분해
        let { name, age, city } = person;

        let instance = obj.study();
        let [firstSubject, secondSubject, thirdSubject] = instance;

        console.log(name); // "Alice"
        // 위의 두개는 큰 차이가 있음

        //(오류는 중복선언 때문이니 넘후 신경쓰지말고)


        // 재밌는거 

        // 이벤트 리스너를 사용하여 버튼 클릭 시 함수를 실행하는 예제
        // HTML에 버튼 요소를 추가하고, JavaScript에서 해당 버튼에 클릭 이벤트 리
        console.log("배열 변수와 함게 시작되는 람다식 ")
        const ages = [12, 17, 8, 21, 14];
        //dummy data -> 가라 데이터

        ages.map((age) => {
            if (age >= 18) {
                console.log(age + " is an adult.");
            } else {
                console.log(age + " is a minor.");
            }
        });

        // map 같은 경우는
        // 인자로 함수를 전달 할 수 있음


        // 그럼 이제 newmap 을 활용하면
        const newAges = ages.map((age) => {
            return age + 1; // 각 나이에 1을 더한 새로운 배열 생성
        });
        // 인자가 한줄로 된 경우 는 () 생략 가능

        const newAges2 = ages.map(age => age + 1); // 각 나이에 1을 더한 새로운 배열 생성
        // return 이 존재한다고 가정한다
        // 근데 육안으로 확인하기 위해 return 을 넣는경우도 잇음

        const userAry = [
            { email : "naver.com" , nickName : "IronMan"},
            { email : "google.com", nickName : "Bob"},
            { email : "daum.com"  , nickName : "Alice"}
       ]

        // email 값을 key 로 nicakName 값을 value 로 하는 
        // 새로운 객체를 생성
        //hint : 배열이 갖고 있는 reduce 라는 method 를 사용
        const userObj = userAry.reduce((acc, user) => {
            acc[user.email] = user.nickName;
            return acc;
        }, {});

        

        //reduce 는 배열의 각 요소를 순회하면서 누적값을 계산하는 메서드임
        // 왜 이름이 reduce 냐? 
        // 데이터를 줄여서 특정 조건에 만족하는 것을 말함

        // 그럼 user 를 추가하는건 ?

        const newUser = { email: "example.com", nickName: "Charlie" };
        userAry.push(newUser);
        // userObj 에도 추가하려면 reduce 를 다시 호출해야 함
        const updatedUserObj = userAry.reduce((acc, user) => {
            acc[user.email] = user.nickName;
            return acc;
        }, {});

        console.log("배열 변수와 함께 시작되는 람다식");

        //

        
        // 인자 는 parameter 라는 뜻

    


        // 복수선언은 array 인 경우



    </script>
    <button>
        <script>
            // 버튼 클릭 시 실행되는 함수
            function handleClick() {
                alert("버튼이 클릭되었습니다!");
            }

            // 버튼에 클릭 이벤트 리스너 등록
            document.querySelector("button").addEventListener("click", handleClick);
            // 리스너가 뭐냐 -> 듣는거임
            // 이거 없으면 interaction 이 어떻게 일어나는지 알 수 없음, 그래서 이벤트 리스너를 등록하는거임
            
        </script>
        Click Me!
    </button>
    
</body>
</html>

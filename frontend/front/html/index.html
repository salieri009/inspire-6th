<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inspire - Demo</title>

    <!-- Bootstrap (local first, CDN fallback handled by loader) -->
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <!-- Project styles (override Bootstrap) -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <main class="container py-5">
      <section class="text-center mb-4">
        <div class="center">여기서 rendering 이 일어난다 이거야.</div>
      </section>

      <section>
        <form action="/action_page.php">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" />
          </div>

          <div class="mb-3">
            <label for="pwd" class="form-label">Password</label>
            <input type="password" class="form-control" id="pwd" placeholder="Enter password" />
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" />
            <label class="form-check-label" for="remember">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </section>
    </main>

    <!-- Loader injects local Bootstrap/Popper or falls back to CDN -->
    <script src="../script/bootstrap-loader.js" defer></script>
  </body>
</html>

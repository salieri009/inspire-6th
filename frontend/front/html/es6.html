<!DOCTYPE html>

    <script>
        // spread operator 는 배열이나 객체를 펼치는 데 사용되는 연산자임
        // 배열에서 spread operator 를 사용하면 배열의 요소를 개별적으로 펼칠 수 있음
        const arr1 = [1, 2, 3];
        const arr2 = [...arr1, 4, 5];
        console.log(arr2); // [1, 2, 3, 4, 5]
        // 객체에서 spread operator 를 사용하면 객체의 속성을 개별적으로 펼칠 수 있음
        const obj1 = { a: 1, b: 2 };
        const obj2 = { ...obj1, c: 3 };
        console.log(obj2); // { a: 1, b: 2, c: 3 }
        // destructuring 은 배열이나 객체의 값을 개별 변수에 할당하는 문법임
        // 배열에서 destructuring 을 사용하면 배열의 요소를 개별 변수에 할당할 수 있음
        const [x, y] = arr1;
        console.log(x, y); // 1 2

        // 객체에서 destructuring 을 사용하면 객체의 속성을 개별 변수에 할당할 수 있음
        const { a, b } = obj1;
        console.log(a, b); // 1 2
        // arrow function 은 function 키워드 대신 화살표(=>)를 사용하여
        // spread operator 는 복제하는 것이지
        // 같은 객체를 가리키는 것이 아님
        // 즉, spread operator 를 사용하면 새로운 객체가 생성되므로

        // 이제 optional chaining 을 사용하면 객체의 속성에 안전하게 접근할 수 있음
        const nestedObj = { level1: { level2: { value: 42 } } } 

        console.log(nestedObj?.level1?.level2?.value); // 42
        console.log(nestedObj?.level1?.level3?.value); // undefined (level3 속성이 없으므로 undefined 반환)

        // enhaced object literals 는 객체 리터럴을 더 간결하게 작성할 수 있는 문법임
        // -> 쉽게 말하면 객체를 만들때 key 와 value 가 같으면 하나만 써도됨

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios</title>
    <link rel="stylesheet" href="../css/create.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // axios 를 활용해서 data.json 을 가져오는 방법
        // axios 는 promise 기반의 HTTP 클라이언트 라이브러리임
        // axios.get() 메서드를 사용하여 GET 요청을 보낼 수 있음
        // axios.post() 메서드를 사용하여 POST 요청을 보낼 수 있음
        // axios.put() 메서드를 사용하여 PUT 요청을 보낼 수 있음
        // axios.delete() 메서드를 사용하여 DELETE 요청을 보낼 수 있음

        //get 방식으로 가져오는 방법
        axios.get('../server/data.json')
            .then(response => {
                console.log(response.data);
                // 데이터를 활용하여 DOM에 표시하거나 다른 작업 수행
            })
            .catch(error => {
                console.error('데이터 가져오기 실패:', error);
            }); 

            // data.json 을 가져오는 방법은 fetch 로도 가능하고 axios 로도 가능함
            // xxx?key = value 로 가져오는것도 가능함
            //finally 는 성공햇건 실패햇건 상관없이 무조건 실행되는 부분임
            //post 되서 server 로 들어가는건
            //capsure 화되서 내용을 가릴수가있다

            // axios.post('data.json', { key: 'value' })
            // 가짜 데이터들은 fake api 로 가져오자
            
            
    </script>
    <h1> 상품목록</h1>
    <div class="container products">   </div>
    <script>
        // (사용하지 않는) loadData 제거
        const makeProduct = (product) => {
            const productDiv = document.createElement('div');
            productDiv.classList.add('product');

            const productName = document.createElement('h2');
            productName.textContent = product.title || product.name;

            const productPrice = document.createElement('p');
            productPrice.textContent = `가격: ${product.price}`;

            const productDescription = document.createElement('p');
            productDescription.textContent = `설명: ${product.description || product.desc || ''}`;

            // 이미지가 있으면 추가
            if (product.image) {
                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.title || 'product image';
                productDiv.appendChild(img);
            }

            productDiv.appendChild(productName);
            productDiv.appendChild(productPrice);
            productDiv.appendChild(productDescription);

            return productDiv;
        }

        const init = async (e) => {
            try {
                const response = await axios.get('../server/data.json');
                let products = response.data;
                if (!Array.isArray(products)) products = [products];

                const container = document.querySelector('.container.products');
                products.forEach(product => {
                    const productElement = makeProduct(product);
                    container.appendChild(productElement);
                });
            } catch (error) {
                console.error('데이터 가져오기 실패:', error);
            }
        }

        // 초기화 호출
        init();
    </script>
</body>
</html>
